<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>橙盘 · OrangeDisk</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb877"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="ringHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf7e"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#f97316"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brandGrad)"/>
          <circle cx="16" cy="16" r="8.4" fill="none" stroke="#fff" stroke-width="2.8"
                  stroke-dasharray="42 11" stroke-linecap="round" transform="rotate(-90 16 16)"/>
          <circle cx="16" cy="16" r="2.6" fill="#fff"/>
        </svg>
      </span>
      <span class="brand-text">橙盘<em>OrangeDisk</em></span>
    </div>

    <nav class="tabs" id="tabs">
      <span class="tab-pill" id="tabPill"></span>
      <button class="tab active" data-tab="disks">磁盘</button>
      <button class="tab" data-tab="files">文件</button>
      <button class="tab" data-tab="big">大文件</button>
      <button class="tab" data-tab="apps">应用</button>
    </nav>

    <div class="top-right">
      <div class="mini-stat" id="miniStat"><span>总容量</span><b>—</b></div>
      <button class="icon-btn" id="refreshBtn" title="刷新数据" aria-label="刷新">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- 磁盘概览 -->
    <section class="view active" id="view-disks">
      <div class="view-head">
        <div>
          <h1>存储概览</h1>
          <p id="diskSummary">正在读取磁盘信息…</p>
        </div>
        <div class="stat-row" id="statRow">
          <div class="stat"><span>总容量</span><b>—</b></div>
          <div class="stat"><span>已用</span><b>—</b></div>
          <div class="stat"><span>可用</span><b>—</b></div>
        </div>
      </div>
      <div class="disk-stage">
        <div class="disk-grid" id="diskGrid"></div>
        <div class="hint-row">点击任意磁盘查看文件夹占用 · 双击文件可在资源管理器中定位</div>
      </div>
    </section>

    <!-- 文件浏览 -->
    <section class="view" id="view-files">
      <div class="file-toolbar">
        <button class="back-btn" id="backBtn" hidden aria-label="返回上级" title="返回上级 (Alt + ←)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="file-tools">
          <div class="seg" id="sortSeg">
            <button data-sort="size" class="on">大小</button>
            <button data-sort="name">名称</button>
            <button data-sort="time">时间</button>
          </div>
          <button class="chip" id="hiddenToggle" aria-pressed="false">显示隐藏</button>
        </div>
      </div>

      <div class="scan-bar" id="scanBar">
        <span class="scan-text" id="scanText"></span>
        <span class="scan-track"><i id="scanFill"></i></span>
      </div>

      <div class="file-head">
        <span></span><span>名称</span><span>大小</span><span>占比</span><span>修改时间</span>
      </div>
      <div class="file-list" id="fileList"></div>
      <div class="empty" id="fileEmpty" hidden></div>
    </section>

    <!-- 大文件 -->
    <section class="view" id="view-big">
      <div class="view-head">
        <div>
          <h1>大文件</h1>
          <p id="bigSummary">扫描整块磁盘，找出最占空间的文件</p>
        </div>
        <div class="big-controls">
          <div class="seg" id="bigDiskSeg"></div>
          <button class="btn-primary" id="bigBtn">开始扫描</button>
        </div>
      </div>

      <div class="big-progress" id="bigProgress" hidden>
        <div class="bp-top">
          <span class="dot"></span>
          <b id="bigTitle">正在扫描</b>
          <span class="bp-stats" id="bigStats"></span>
        </div>
        <div class="bp-track"><i id="bigFill"></i></div>
        <div class="bp-path" id="bigPath"></div>
      </div>

      <div class="big-list" id="bigList"></div>
      <div class="empty" id="bigEmpty">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 50 30 22l10 16 6-9 4 21z" fill="none" stroke="#ffc79c" stroke-width="2.6" stroke-linejoin="round"/><circle cx="20" cy="16" r="3.4" fill="#ffbf8c"/><path d="M8 56h48" stroke="#ffe0c6" stroke-width="3" stroke-linecap="round"/></svg>
        <div>选一块磁盘，点「开始扫描」找找谁最占地方</div>
      </div>
    </section>

    <!-- 应用 -->
    <section class="view" id="view-apps">
      <div class="view-head">
        <div>
          <h1>应用占用</h1>
          <p id="appSummary">读取已安装应用…</p>
        </div>
        <div class="app-tools">
          <input class="search" id="appSearch" type="search" placeholder="搜索应用或发布者" spellcheck="false">
        </div>
      </div>
      <div class="app-list" id="appList"></div>
      <div class="empty" id="appEmpty" hidden></div>
    </section>
  </main>

  <footer class="app-foot">橙盘 OrangeDisk · 数据在本机实时读取，不会上传</footer>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js" defer></script>
</body>
</html>
